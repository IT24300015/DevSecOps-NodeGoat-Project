rules:
  - id: nodegoat-plaintext-password-storage
    languages: [javascript]
    message: >-
      Password stored in plaintext. Passwords must be hashed with bcrypt,
      argon2, or scrypt before storage.
    severity: ERROR
    pattern-regex: 'password\s*//\s*received from request param|password\s*:\s*password\b'
    metadata:
      cwe: "CWE-256"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      category: security