name: DevSecOps Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # BUILD AND TEST
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Verify application syntax
        run: |
          echo "Checking NodeGoat application..."
          node -c app/server.js
          echo "✓ app/server.js syntax OK"


  # GATE 1: SAST
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config auto \
            --error \
            --exclude node_modules \
            /src


  # GATE 2: DEPENDENCY SCANNING
  dependency-scan:
    name: Dependency Scan - npm audit
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=high


  # GATE 3: SECRETS SCANNING
  secrets-scan:
    name: Secrets Scan - Gitleaks
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            -v \
            --exit-code=2


  # GATE 4: CONTAINER IMAGE SCANNING
  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t nodegoat-web:${{ github.sha }} .

      - name: Run Trivy on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nodegoat-web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true


  # OPTIONAL DAST
  dast:
    name: DAST - OWASP ZAP (Optional)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application
        run: |
          docker compose up -d
          sleep 15

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:4000 \
            -I
        continue-on-error: true

      - name: Stop containers
        if: always()
        run: docker compose down