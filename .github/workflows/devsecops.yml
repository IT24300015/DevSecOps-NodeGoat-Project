name: DevSecOps Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  
  # GATE 1: Build and Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Verify app starts (smoke test)
        run: |
          echo "Building the NodeGoat application..."
          node -c server.js
          echo "✓ server.js syntax OK"

  
  # GATE 2: SAST (Semgrep)

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "$PWD:/src" returntocorp/semgrep:latest \
            semgrep scan --config auto --error --exclude node_modules /src
        continue-on-error: false

  
  # GATE 3: Dependency Scanning (npm audit)
  
  dependency-scan:
    name: Dependency Scan - npm audit
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit (fail on HIGH)
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=critical --production || echo "Audit found issues (see above)"

  
  # GATE 4: Secrets Scanning (Gitleaks)
  
  secrets-scan:
    name: Secrets Scan - Gitleaks
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-git -v --exit-code=2
        continue-on-error: false


  # GATE 5: Container Image Scanning (Trivy)

  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nodegoat-web:${{ github.sha }} .

      - name: Run Trivy on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nodegoat-web:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
        continue-on-error: false

  
  # OPTIONAL: DAST (OWASP ZAP)

  dast:
    name: DAST - OWASP ZAP (Optional)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start app with docker-compose
        run: |
          docker compose up -d
          sleep 15

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:4000 -I
        continue-on-error: true

      - name: Stop containers
        if: always()
        run: docker compose down